name: sprint
description: "Sprint (سبرنت) — digital governance system for sports facility management at Tanta University."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.3

  # Code generation (runtime annotations)
  freezed_annotation: ^3.1.0
  json_serializable: ^6.8.0

  # Localization
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.3.2

  # Splash screen — runtime API (preserve/remove) used in main.dart and SplashScreen
  flutter_native_splash: ^2.4.7
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (dev tools)
  build_runner: ^2.4.0
  riverpod_generator: ^4.0.10
  freezed: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/l10n/
    - assets/fonts/Cairo/
    - assets/images/icons/
    - assets/splash/
    - assets/icon/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
          weight: 900
