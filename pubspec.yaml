name: sprint
description: "Sprint (سبرنت) — digital governance system for sports facility management at Tanta University."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.1

  # Navigation
  go_router: ^14.3.0

  # Code generation (runtime annotations)
  freezed_annotation: ^2.4.4
  json_serializable: ^6.8.0

  # Localization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (dev tools)
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.4
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/l10n/
    - assets/fonts/Cairo/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
          weight: 900
